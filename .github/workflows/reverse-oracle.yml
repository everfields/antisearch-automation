name: reverse-oracle

# From target accounts (queue/reverse_oracle/targets.csv) to short inputs whose REAL
# verdict names them: a generator model (any OpenAI-compatible endpoint: secret
# REVERSE_ORACLE_GENERATOR_KEY, vars REVERSE_ORACLE_GENERATOR_URL / REVERSE_ORACLE_MODEL),
# or a reviewed candidates file, proposes inputs; each is verified with one call to the
# publisher's oracle path, under a budget.
# Every live verdict is frozen in publisher-state/verdicts.csv; results go to
# publisher-state/reverse_oracle/. An input already frozen or tried is never asked again.
# Nothing is posted or scheduled.
#   Manual: Actions -> reverse-oracle -> Run workflow (dry-run unless `live` is ticked).

on:
  pull_request:  # TEMPORARY: one live run as run 2026-09-27-r1 (candidates file: GitHub Models is retired), removed right after
    paths: [.github/workflows/reverse-oracle.yml]
  workflow_dispatch:
    inputs:
      live:
        description: Really call the oracle
        type: boolean
        default: false
      budget:
        description: Max live oracle calls
        default: "100"
      candidates:
        description: Candidates JSON instead of the generator (empty = generator)
        default: ""
      run_id:
        description: Run id (a used id is never run again; empty = timestamp)
        default: ""

permissions:
  contents: write

concurrency:
  group: publisher  # shared with publisher.yml: one writer of publisher-state at a time
  cancel-in-progress: false

jobs:
  reverse:
    runs-on: ubuntu-24.04
    env:
      LIVE: ${{ github.event_name == 'pull_request' || inputs.live }}
      BUDGET: ${{ inputs.budget || '100' }}
      CANDIDATES: ${{ github.event_name == 'pull_request' && 'queue/reverse_oracle/candidates-2026-09-27.json' || inputs.candidates }}
      REVERSE_ORACLE_GENERATOR_KEY: ${{ secrets.REVERSE_ORACLE_GENERATOR_KEY }}
      REVERSE_ORACLE_GENERATOR_URL: ${{ vars.REVERSE_ORACLE_GENERATOR_URL }}
      REVERSE_ORACLE_MODEL: ${{ vars.REVERSE_ORACLE_MODEL }}
      RUN_ID: ${{ github.event_name == 'pull_request' && '2026-09-27-r1' || inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .

      - name: Load publisher-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch publisher-state "$remote" state

      - name: Reverse oracle
        run: |
          python scripts/reverse_oracle.py --state state --budget "$BUDGET" \
            $([ -n "$CANDIDATES" ] && echo --candidates "$CANDIDATES") --check-sites $([ -n "$RUN_ID" ] && echo --run-id "$RUN_ID") $([ "$LIVE" = "true" ] && echo --live)

      - name: Save results and frozen verdicts
        if: always() && env.LIVE == 'true'
        run: |
          cd state
          git add -A verdicts.csv reverse_oracle
          git diff --cached --quiet && exit 0
          git -c user.name=antisearch-publisher -c user.email=actions@users.noreply.github.com \
            commit --quiet -m "reverse oracle $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            git push --quiet origin publisher-state && exit 0
            sleep $((i * 5))
            git pull --quiet --rebase origin publisher-state
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverse-oracle-${{ github.run_id }}
          path: state/reverse_oracle/
          if-no-files-found: ignore
          retention-days: 14
