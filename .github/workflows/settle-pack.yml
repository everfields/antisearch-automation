name: settle-pack

# settle it (founder, 2026-09-29), with no LLM and no agent: a TEXT-ONLY thread list every 2 days
# for Carlos, who posts on Reddit himself.
#   find:  live "what's the best X?" threads (Reddit RSS, Bluesky search), under 48 h, Soul's skips,
#          each question made a BARE input -> publisher-state/settle/threads-<day>.md.
#   shoot: ONE live run per row through antisearch.ai in headless Chrome (marked internal), the
#          output frozen in verdicts.csv, the call in settle/internal-calls.csv; `no` drops the row.
# No screenshot, GIF, video or caption. Nothing is ever posted.

on:
  schedule:
    - cron: "0 17 * * *"  # 19:00 Madrid (summer); the gate below keeps every other day
  workflow_dispatch:
    inputs:
      day:
        description: List day YYYY-MM-DD (empty = today in Madrid)
        default: ""

permissions:
  contents: write

concurrency:
  group: publisher  # one writer of publisher-state at a time
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-24.04
    env:
      DAY: ${{ inputs.day }}
    steps:
      - name: Every 2 days
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( $(date -u +%s) / 86400 % 2 )) -ne 0 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "odd day: the list comes every 2 days"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.go == 'true'
        run: python -m pip install -e '.[settle]'

      - name: Load publisher-state
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --depth 1 --branch publisher-state "$remote" state

      - name: Find (bare inputs, read-only)
        id: find
        if: steps.gate.outputs.go == 'true'
        run: |
          if mill settle-find --state state/posts.csv $([ -n "$DAY" ] && echo --day "$DAY"); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            code=$?; echo "found=false" >> "$GITHUB_OUTPUT"; [ $code -eq 3 ]
          fi

      - name: Chrome for shoot
        if: steps.find.outputs.found == 'true'
        run: command -v google-chrome || python -m playwright install --with-deps chromium

      - name: Shoot (one live run per row, text only)
        if: steps.find.outputs.found == 'true'
        run: mill settle-shoot --state state/posts.csv --chrome "$(command -v google-chrome || true)"

      - name: Save it
        if: steps.gate.outputs.go == 'true'
        run: |
          cd state
          git add -A settle verdicts.csv
          git diff --cached --quiet && exit 0
          git -c user.name=antisearch-publisher -c user.email=actions@users.noreply.github.com \
            commit --quiet -m "settle threads $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            git push --quiet origin publisher-state && exit 0
            sleep $((i * 5))
            git pull --quiet --rebase origin publisher-state
          done
          exit 1
