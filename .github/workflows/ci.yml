name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps (ffmpeg with drawtext, Inter font)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter
      - run: python -m pip install -e '.[dev]'
      - run: make test
      - name: Offline dry-run proof (fixture oracle, no tokens)
        run: make dry-run-offline
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-offline
          path: out-dry-run-offline/
          retention-days: 7
