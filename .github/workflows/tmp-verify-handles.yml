name: tmp-verify-handles
# TEMPORARY, read-only: public Instagram profile data for the IG mention candidates. Removed after use.
on:
  pull_request:
    paths: [".github/tmp/verify_handles.py", ".github/workflows/tmp-verify-handles.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python .github/tmp/verify_handles.py
