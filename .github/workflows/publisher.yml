name: publisher

# Own publisher: native official APIs for every network (Bluesky, Instagram Reels,
# LinkedIn Page, TikTok). Buffer free is an optional bridge (PUBLISHER_BRIDGE=buffer)
# for networks whose native gate hasn't cleared. No browser, no Grok Bot box. Off by default.
#   Manual: Actions -> publisher -> Run workflow (dry-run unless `live` is ticked).
#   Cron:   every 15 minutes in the ET posting window, off the top of the hour (GitHub drops
#           most scheduled wakes when it is busy; 28 Sep: 1 in 8 hours); runs only when the
#           repo variable PUBLISHER_CRON is `dry-run` or `live`. A late or dropped start is
#           still inside the slot window, and a slot whose whole window was missed is still
#           sent by the next run (the catch-up, guard.CATCHUP_WINDOW). `mill due` decides.
#   Tick:   a `repository_dispatch` of type `publisher-tick` wakes it exactly like the cron,
#           for an external pinger (docs/PUBLISHER_SETUP.md, "Reliable wakes").
# Slots are America/New_York wall-clock times (docs/PUBLISHER_SETUP.md); the cron
# only wakes the job, and `mill due` decides from the tz database whether a slot
# has come, so summer/winter time needs no edits here. Live posting also needs
# the network in PUBLISHER_LIVE_NETWORKS (the recorded first-of-class yes) and its
# secrets. The post log and the frozen verdicts (one honest oracle run per input)
# live on the `publisher-state` branch, so runs never double-post or re-ask.

on:
  workflow_dispatch:
    inputs:
      live:
        description: Really post (still needs PUBLISHER_LIVE_NETWORKS + secrets)
        type: boolean
        default: false
      ignore_slots:
        description: Live only - post now even if no slot is due (daily cap still applies)
        type: boolean
        default: false
      network:
        description: Only this network (empty = all)
        default: ""
  repository_dispatch:
    types: [publisher-tick]
  schedule:
    # Every 15 min from 13:00 through 05:59 UTC covers 09:00-01:59 EDT and 08:00-00:59 EST.
    # Wakes at :04/:19/:34/:49 (the top of the hour is GitHub's busiest); slots stay on :07.
    - cron: "4,19,34,49 0-5,13-23 * * *"

permissions:
  contents: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISHER_CRON == 'dry-run' || vars.PUBLISHER_CRON == 'live'
    runs-on: ubuntu-24.04
    env:
      LIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.live) || (github.event_name != 'workflow_dispatch' && vars.PUBLISHER_CRON == 'live') }}
      IGNORE_SLOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_slots }}
      QUEUE: ${{ vars.PUBLISHER_QUEUE || 'queue/bluesky_trial.csv queue/tiktok_trial.csv queue/surprise_trial.csv' }}
      NETWORK: ${{ inputs.network }}
      PUBLISHER_LIVE_NETWORKS: ${{ vars.PUBLISHER_LIVE_NETWORKS }}
      PUBLISHER_TREND_NETWORKS: ${{ vars.PUBLISHER_TREND_NETWORKS }}
      PUBLISHER_TREND_CAP: ${{ vars.PUBLISHER_TREND_CAP }}
      PUBLISHER_WINNER_NETWORKS: ${{ vars.PUBLISHER_WINNER_NETWORKS }}
      PUBLISHER_WINNER_CAP: ${{ vars.PUBLISHER_WINNER_CAP }}
      PUBLISHER_REPLY_NETWORKS: ${{ vars.PUBLISHER_REPLY_NETWORKS }}
      PUBLISHER_REPLY_CAP: ${{ vars.PUBLISHER_REPLY_CAP }}
      PUBLISHER_WATCH_BLUESKY: ${{ vars.PUBLISHER_WATCH_BLUESKY }}
      PUBLISHER_CADENCE: ${{ vars.PUBLISHER_CADENCE }}
      PUBLISHER_CLIP_STYLE: ${{ vars.PUBLISHER_CLIP_STYLE }}
      PUBLISHER_CLIP_AUDIO: ${{ vars.PUBLISHER_CLIP_AUDIO }}
      PUBLISHER_CLIP_AUDIO_VARIANT: ${{ vars.PUBLISHER_CLIP_AUDIO_VARIANT }}
      PUBLISHER_CLIP_AUDIO_BED: ${{ vars.PUBLISHER_CLIP_AUDIO_BED }}
      PUBLISHER_CLIP_KEYS_SOUND: ${{ vars.PUBLISHER_CLIP_KEYS_SOUND }}
      PUBLISHER_TAG_NETWORKS: ${{ vars.PUBLISHER_TAG_NETWORKS }}
      PUBLISHER_X_FORMAT: ${{ vars.PUBLISHER_X_FORMAT }}
      PUBLISHER_IG_CAPTION: ${{ vars.PUBLISHER_IG_CAPTION }}
      PUBLISHER_CLIP_TYPING: ${{ vars.PUBLISHER_CLIP_TYPING }}
      PUBLISHER_CLIP_FRAME: ${{ vars.PUBLISHER_CLIP_FRAME }}
      PUBLISHER_CLIP_PHONE_SCALE: ${{ vars.PUBLISHER_CLIP_PHONE_SCALE }}
      PUBLISHER_CLIP_PHONE_BG: ${{ vars.PUBLISHER_CLIP_PHONE_BG }}
      PUBLISHER_RAMP: ${{ vars.PUBLISHER_RAMP }}
      PUBLISHER_JITTER: ${{ vars.PUBLISHER_JITTER }}
      PUBLISHER_AI_INPUTS: ${{ vars.PUBLISHER_AI_INPUTS }}
      # PUBLISHER_IG_ROTATION is not read here (founder, 2026-09-29): Instagram posts the clean creative only.
      PUBLISHER_IG_STORIES: ${{ vars.PUBLISHER_IG_STORIES }}
      PUBLISHER_IG_CLUSTER: ${{ vars.PUBLISHER_IG_CLUSTER }}
      PUBLISHER_LANGUAGE: ${{ vars.PUBLISHER_LANGUAGE }}
      PUBLISHER_SLOTS_BLUESKY: ${{ vars.PUBLISHER_SLOTS_BLUESKY }}
      PUBLISHER_SLOTS_LINKEDIN: ${{ vars.PUBLISHER_SLOTS_LINKEDIN }}
      PUBLISHER_SLOTS_INSTAGRAM: ${{ vars.PUBLISHER_SLOTS_INSTAGRAM }}
      PUBLISHER_SLOTS_TIKTOK: ${{ vars.PUBLISHER_SLOTS_TIKTOK }}
      PUBLISHER_SLOTS_X: ${{ vars.PUBLISHER_SLOTS_X }}
      PUBLISHER_BRIDGE: ${{ vars.PUBLISHER_BRIDGE }}
      PUBLISHER_ROUTE_INSTAGRAM: ${{ vars.PUBLISHER_ROUTE_INSTAGRAM }}
      PUBLISHER_ROUTE_LINKEDIN: ${{ vars.PUBLISHER_ROUTE_LINKEDIN }}
      PUBLISHER_ROUTE_TIKTOK: ${{ vars.PUBLISHER_ROUTE_TIKTOK }}
      PUBLISHER_ROUTE_X: ${{ vars.PUBLISHER_ROUTE_X }}
      PUBLISHER_MEDIA_REPO: ${{ vars.PUBLISHER_MEDIA_REPO }}
      PUBLISHER_PUBLIC_BASE_URL: ${{ vars.PUBLISHER_PUBLIC_BASE_URL }}
      PUBLISHER_MEDIA_TOKEN: ${{ secrets.PUBLISHER_MEDIA_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_INSTAGRAM: ${{ vars.BUFFER_CHANNEL_INSTAGRAM }}
      BUFFER_CHANNEL_LINKEDIN: ${{ vars.BUFFER_CHANNEL_LINKEDIN }}
      BUFFER_CHANNEL_TIKTOK: ${{ vars.BUFFER_CHANNEL_TIKTOK }}
      BUFFER_CHANNEL_X: ${{ vars.BUFFER_CHANNEL_X }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_ORGANIZATION_ID: ${{ vars.LINKEDIN_ORGANIZATION_ID }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION }}
      MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .

      - name: Load the post log (publisher-state branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" publisher-state >/dev/null; then
            git clone --quiet --depth 1 --branch publisher-state "$remote" state
          else
            git init --quiet -b publisher-state state
            git -C state remote add origin "$remote"
          fi

      - name: Replies (Bluesky, verdict only, capped; every hour, no ffmpeg needed)
        if: contains(vars.PUBLISHER_REPLY_NETWORKS, 'bluesky')
        run: mill replies --state state/posts.csv $([ "$LIVE" = "true" ] && echo --live)

      - name: Anything due? (scheduled runs stop here when not)
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$LIVE" != "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if mill due --state state/posts.csv; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.due.outputs.go == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter

      - name: Post (only a live run asks the real oracle; its verdict is frozen in state/verdicts.csv)
        if: steps.due.outputs.go == 'true'
        run: |
          flags=()
          for q in ${QUEUE//,/ }; do flags+=(--queue "$q"); done
          [ "$LIVE" = "true" ] && flags+=(--live)
          [ "$IGNORE_SLOTS" = "true" ] && flags+=(--ignore-slots)
          [ -n "$NETWORK" ] && flags+=(--network "$NETWORK")
          mill --out out post --state state/posts.csv "${flags[@]}"

      - name: Save the state (post log, frozen verdicts, replies, the day's trend list)
        if: always() && env.LIVE == 'true'
        run: |
          cd state
          git add -A .
          git diff --cached --quiet && exit 0
          git -c user.name=antisearch-publisher -c user.email=actions@users.noreply.github.com \
            commit --quiet -m "post log $(date -u +%FT%TZ)"
          git push --quiet origin publisher-state

      - uses: actions/upload-artifact@v4
        if: always() && steps.due.outputs.go == 'true'
        with:
          name: publisher-${{ github.run_id }}
          path: |
            out/dry_run_posts/
            out/logs/
            state/*.csv
          if-no-files-found: ignore
          retention-days: 7
